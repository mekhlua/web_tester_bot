{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Web Tester{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'bot/css/output.css' %}">
</head>
<body class="bg-paper text-ink min-h-screen">
  {% include "bot/partials/_navbar.html" %}

  <main class="max-w-4xl mx-auto px-4 py-8">
    {% include "bot/partials/_messages.html" %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
